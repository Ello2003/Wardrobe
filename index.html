<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track garments, homeware, cost-per-wear economics, care guides, and styling combinations in GBP (£)." />
    <meta property="og:title" content="Wardrobe & Style Studio" />
    <meta property="og:description" content="Track garments, homeware, cost-per-wear economics, care guides, and styling combinations in GBP (£)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Wardrobe & Style Studio</title>
    <script>
      // Global error interceptor to prevent benign ResizeObserver warnings or cross-origin iframe Script error redactions
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (
          typeof msg === 'string' &&
          (msg.includes('ResizeObserver') ||
            msg.includes('Script error') ||
            msg.includes('Loading chunk') ||
            msg.includes('dynamically imported module'))
        ) {
          // Benign browser layout / network events inside iframes
          console.warn('[Wardrobe Studio Handled Environment Notice]:', msg);
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }

        if (event.error) {
          console.error('[Wardrobe Studio Uncaught Error]:', event.error.message, event.error.stack);
        } else {
          console.warn('[Wardrobe Studio Script Event]:', event.message, event.filename, event.lineno);
        }
        if (event.preventDefault) event.preventDefault();
        return true;
      });

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (typeof msg === 'string' && msg.includes('ResizeObserver')) {
          if (event.preventDefault) event.preventDefault();
          return;
        }
        console.warn('[Wardrobe Studio Handled Promise Rejection]:', reason);
        if (event.preventDefault) event.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F8F7F4;font-family:ui-sans-serif,system-ui,sans-serif;color:#1A1A1A" role="status" aria-live="polite">
        <div style="width:2.25rem;height:2.25rem;border:3px solid #E5E5E1;border-top-color:#8C7355;border-radius:50%;animation:studio-spin .8s linear infinite;margin-bottom:.875rem"></div>
        <div style="font-size:.875rem;font-weight:600;letter-spacing:.05em;color:#8C7355;text-transform:uppercase">Wardrobe &amp; Style Studio</div>
        <div style="font-size:.75rem;color:#767670;margin-top:.25rem">Loading studio…</div>
      </div>
    </div>
    <style>@keyframes studio-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" crossorigin="anonymous" src="/src/main.tsx"></script>
  </body>
</html>
